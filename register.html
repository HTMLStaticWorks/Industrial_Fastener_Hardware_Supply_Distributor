<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Business Account – IndustrialPro Fasteners</title>
  <meta name="description" content="Register for an IndustrialPro commercial procurement account. Unlock contract pricing, net payment terms, and automated VMI support.">
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg">
  <link rel="apple-touch-icon" href="assets/images/favicon.jpg">
  
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body style="overflow: hidden;">

  <!-- Centered Layout, Vertically and Horizontally, Zero Scroll, NO theme toggle, NO back to home button -->
  <main class="auth-page">
    <div class="auth-card" style="max-width: 480px;">
      <div class="brand-logo">
        <i class="ri-tools-fill"></i>
        <span>Fasten<span class="accent">Core</span></span>
      </div>

      <h2>Create Business Account</h2>
      <p style="font-size: var(--size-caption); color: var(--color-text-muted);">Apply for commercial B2B procurement, credit terms, and tiered volume pricing.</p>

      <form class="auth-form validated-form" action="dashboard.html" method="GET" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name / Procurement Officer <span class="required">*</span></label>
          <input type="text" id="reg-name" name="name" class="form-control" required placeholder="Marcus Vance">
          <div class="error-message">Name is required.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Commercial Email Address <span class="required">*</span></label>
          <input type="email" id="reg-email" name="email" class="form-control" required placeholder="purchasing@company.com">
          <div class="error-message">Valid corporate email is required.</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
            <input type="password" id="reg-password" name="password" class="form-control" required minlength="8" placeholder="••••••••">
            <div class="error-message">Min 8 characters.</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
            <input type="password" id="reg-confirm-password" name="confirm_password" class="form-control" required minlength="8" placeholder="••••••••">
            <div class="error-message">Passwords must match.</div>
          </div>
        </div>

        <div class="checkbox-wrap">
          <input type="checkbox" id="reg-terms" name="terms" required>
          <label for="reg-terms">I accept the <a href="#" style="color: var(--color-accent);">Terms & Conditions</a> and privacy policy.</label>
          <div class="error-message">You must accept the terms.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-submit">Register</button>
      </form>

      <div class="auth-divider">
        <span>or register with</span>
      </div>

      <div class="social-auth-btns">
        <button type="button" class="btn-social" onclick="window.location.href='dashboard.html'">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.548 0 9s.347 2.827.957 4.039l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>

        <button type="button" class="btn-social" onclick="window.location.href='dashboard.html'">
          <i class="ri-apple-fill" style="font-size: 1.25rem;"></i>
          Continue with Apple
        </button>
      </div>

      <div class="auth-footer-link">
        Already registered? <a href="login.html">Login here</a>
      </div>
    </div>
  </main>
  <!-- Back To Top Button -->
  <button id="back-to-top" aria-label="Back to top" title="Back to top">
    <i class="ri-arrow-up-line"></i>
  </button>


  <script src="assets/js/main.js"></script>
</body>
</html>
